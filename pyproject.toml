[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "infernal-gpu"
version = "0.1.0"
description = "GPU covariance-model calibration and search for Infernal, with results matching Infernal"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Infernal-GPU authors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Environment :: GPU :: NVIDIA CUDA",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
infernal-gpu = "infernal_gpu.cli:main"

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = ["infernal_gpu"]
